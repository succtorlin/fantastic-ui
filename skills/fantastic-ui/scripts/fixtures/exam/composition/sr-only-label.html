<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen-reader-only label</title>
<style>body{margin:0;font:16px system-ui;background:#fff;color:#222}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}main{padding:24px}input{background:#fff;border:1px solid #767676;padding:8px;font:inherit}a.skip{position:absolute;left:-999px}a.skip:focus{left:8px}:focus-visible{outline:2px solid #1a4fd6;outline-offset:2px}</style></head>
<body><a class="skip" href="#main">Skip to content</a><header><nav aria-label="Main"><a href="#main">Home</a></nav></header>
<main id="main"><h1>Search</h1><form><label class="sr-only" for="q">Hidden search label</label><input id="q" name="q"></form></main><footer><p>Footer</p></footer></body></html>
