<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam fixture: traps</title>
<style>
  :root { --ground: #fbfaf7; --ink: #1d1c1a; --ink-2: #55524c; --accent: #0f4c81; --hair: #d9d5cc; --scrim: rgb(0 0 0 / 0.4); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  a, button { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .skip { position: absolute; left: -9999px; }
  .skip:focus { left: 16px; top: 16px; }
  header, main, footer { max-width: 960px; margin: 0 auto; padding: 16px; }
  nav { display: flex; gap: 24px; }
  nav a { display: inline-flex; align-items: center; min-height: 44px; }
  button { font: inherit; min-height: 44px; padding: 0 16px; background: var(--ground); border: 1px solid var(--accent); border-radius: 4px; white-space: nowrap; }
  p { color: var(--ink-2); }
  dialog { border: 1px solid var(--hair); border-radius: 6px; padding: 24px; max-width: min(90vw, 420px); background: var(--ground); color: var(--ink); }
  .sheet { position: fixed; inset: 20% 10%; background: var(--ground); border: 1px solid var(--hair); padding: 24px; }
  dialog::backdrop { background: var(--scrim); }
  html.js .reveal { opacity: 0; transition: opacity 0.4s; }
  html.js .reveal.in { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { html.js .reveal { transition: none; } }
</style>
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><nav aria-label="Site"><a href="#main">Overview</a><a href="#plans">Plans</a></nav></header>
<main id="main">
  <h1>Ride the fjord road without the hill.</h1>
  <p class="reveal" style="opacity:0">Electric bikes by the day, collected at the ferry.</p>
  <h2 id="plans">Plans</h2>
  <p>Book a full day or a half day.</p>
  <button type="button" id="open-booking">Book a bike</button>
  <button type="button" id="open-help">Help</button>
  <div id="help" class="sheet" role="dialog" hidden>
    <p>Call the ferry desk.</p>
  </div>
  <div id="booking" class="sheet" hidden>
    <h2>Book a bike</h2>
    <p>Pick a day at the ferry desk.</p>
    <label>Day <input type="date"></label>
  </div>
</main>
<footer><p>Halden Bikes · Flåm ferry quay</p></footer>
<script>
  const dlg = document.getElementById("booking");
  document.getElementById("open-booking").addEventListener("click", () => { dlg.hidden = false; });
  document.getElementById("open-help").addEventListener("click", () => { document.getElementById("help").hidden = false; });
  setTimeout(() => { for (const el of document.querySelectorAll(".reveal")) el.style.opacity = 1; }, 50);
</script>
</body>
</html>
